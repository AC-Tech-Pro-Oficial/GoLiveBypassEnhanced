name: Enhanced RTC Verify

on:
  workflow_dispatch:
  push:
    branches:
      - enhanced/rtc-viewer-recovery-v1

permissions:
  contents: write

jobs:
  enhanced-rtc:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prove regression fails before implementation
        shell: bash
        run: |
          set -euo pipefail
          if node tests/test-enhanced-rtc-recovery.cjs > /tmp/enhanced-before.log 2>&1; then
            cat /tmp/enhanced-before.log
            echo 'Expected enhanced RTC regression to fail before implementation.' >&2
            exit 1
          fi
          echo 'Regression fails on the pre-enhanced implementation as expected:'
          tail -n 25 /tmp/enhanced-before.log

      - name: Apply deterministic enhanced RTC transform
        run: python3 scripts/apply-enhanced-rtc.py

      - name: Run enhanced RTC regression
        run: node tests/test-enhanced-rtc-recovery.cjs

      - name: Run native RTC regression suite
        run: node tests/test-native-rtc-recovery.cjs

      - name: Run gateway recovery regression suite
        run: node tests/test-gateway-zumbi-revive.cjs

      - name: Install GUI dependencies
        working-directory: golive-gui
        run: npm ci

      - name: Regenerate embedded bypass
        working-directory: golive-gui
        run: npm run sync-bypass

      - name: Run GUI tests
        working-directory: golive-gui
        run: npm test

      - name: Compile GUI
        working-directory: golive-gui
        run: npm run compile

      - name: Verify sync is deterministic
        shell: bash
        run: |
          set -euo pipefail
          cp golive-gui/electron/bypass.ts /tmp/bypass-before-second-sync.ts
          (cd golive-gui && npm run sync-bypass)
          cmp /tmp/bypass-before-second-sync.ts golive-gui/electron/bypass.ts

      - name: Verify generated change set
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed = {
              'standalone/golivebypass.js',
              'tests/test-native-rtc-recovery.cjs',
              'CHANGELOG.md',
              'golive-gui/electron/bypass.ts',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit('Unexpected generated changes: ' + ', '.join(sorted(unexpected)))
          missing = {'standalone/golivebypass.js', 'golive-gui/electron/bypass.ts'} - changed
          if missing:
              raise SystemExit('Expected generated changes missing: ' + ', '.join(sorted(missing)))
          PY

      - name: Commit verified generated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add standalone/golivebypass.js tests/test-native-rtc-recovery.cjs CHANGELOG.md golive-gui/electron/bypass.ts
          git commit -m 'fix: add role-aware native RTC recovery [enhanced-generated]'
          git push origin HEAD:enhanced/rtc-viewer-recovery-v1
