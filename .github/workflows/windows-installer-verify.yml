name: Windows Enhanced Installer Verify

on:
  push:
    branches:
      - enhanced/rtc-viewer-recovery-v1

jobs:
  windows-installer:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Installer contract
        run: node tests/test-windows-enhanced-installer.cjs
      - name: Parse PowerShell installers
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'installer/Install-Enhanced.ps1'), [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'standalone/GoLiveBypass-Standalone.ps1'), [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
      - name: RTC regressions
        shell: bash
        run: |
          node tests/test-enhanced-rtc-recovery.cjs
          node tests/test-native-rtc-recovery.cjs
          node tests/test-gateway-zumbi-revive.cjs
      - name: Diff hygiene
        shell: bash
        run: git diff --check HEAD~4..HEAD
