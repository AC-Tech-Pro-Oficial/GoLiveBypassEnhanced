name: Enhanced Installer and Plugin Verify

on:
  push:
    branches:
      - enhanced/rtc-viewer-recovery-v1

jobs:
  tor-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve current Tor expert bundle checksums
        shell: bash
        run: |
          set -euo pipefail
          base='https://dist.torproject.org/torbrowser/15.0.21'
          curl -fsS "$base/sha256sums-unsigned-build.txt" -o sha256sums.txt
          for name in \
            tor-expert-bundle-windows-x86_64-15.0.21.tar.gz \
            tor-expert-bundle-linux-x86_64-15.0.21.tar.gz \
            tor-expert-bundle-macos-aarch64-15.0.21.tar.gz \
            tor-expert-bundle-macos-x86_64-15.0.21.tar.gz
          do
            line="$(grep "  $name$" sha256sums.txt)"
            test -n "$line"
            echo "TOR_SHA_LINE=$line"
          done

  windows-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Installer and RTC contracts
        run: |
          node tests/test-windows-enhanced-installer.cjs
          node tests/test-plugin-enhanced-rtc.cjs
          node tests/test-enhanced-rtc-recovery.cjs
          node tests/test-native-rtc-recovery.cjs
          node tests/test-gateway-zumbi-revive.cjs

      - name: Parse PowerShell
        shell: pwsh
        run: |
          $files = @(
            'installer/Install-Enhanced.ps1',
            'installer/GoLiveBypass-Installer.ps1',
            'standalone/GoLiveBypass-Standalone.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              Write-Host "Parser errors in $file"
              foreach ($err in $errors) {
                Write-Host ("{0}:{1} {2} :: {3}" -f $err.Extent.StartLineNumber, $err.Extent.StartColumnNumber, $err.ErrorId, $err.Message)
                Write-Host ("  > " + $err.Extent.Text)
              }
              exit 1
            }
          }

      - name: Real Tor gateway smoke test
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File installer/GoLiveBypass-Installer.ps1 -Mode TestTor -Tor -Yes
          if ($LASTEXITCODE -ne 0) {
            $log = Join-Path $env:LOCALAPPDATA 'GoLiveBypass\Tor\tor-bootstrap.log'
            if (Test-Path -LiteralPath $log) {
              Write-Host '--- tor-bootstrap.log tail ---'
              Get-Content -LiteralPath $log -Tail 120
            }
            exit $LASTEXITCODE
          }

      - name: Diff hygiene
        shell: bash
        run: git diff --check origin/main...HEAD

  clean-windows-bootstrap:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert clean app state
        shell: powershell
        run: |
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'Discord')) { throw 'Runner unexpectedly already has Discord.' }
          if (Test-Path (Join-Path $env:USERPROFILE 'Equicord')) { throw 'Runner unexpectedly already has Equicord checkout.' }
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'GoLiveBypass\Tor\tor\tor.exe')) { throw 'Runner unexpectedly already has managed Tor.' }

      - name: Install from zero
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File installer/GoLiveBypass-Installer.ps1 -Mode Install -Mod Equicord -Tor -Yes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify clean bootstrap result
        shell: powershell
        run: |
          $discordResources = Get-ChildItem -Path (Join-Path $env:LOCALAPPDATA 'Discord\app-*\resources') -Directory -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $discordResources) { throw 'Discord resources were not installed.' }

          $equicord = Join-Path $env:USERPROFILE 'Equicord'
          if (-not (Test-Path (Join-Path $equicord 'package.json'))) { throw 'Equicord checkout missing.' }

          $plugin = Join-Path $equicord 'src\userplugins\goLiveBypass'
          foreach ($file in @('index.tsx','native.ts','rtcRecovery.ts','rtcShim.ts','manifest.json')) {
            if (-not (Test-Path (Join-Path $plugin $file))) { throw "Enhanced plugin file missing: $file" }
          }

          $settingsFile = Join-Path $env:APPDATA 'Equicord\settings\settings.json'
          if (-not (Test-Path $settingsFile)) { throw 'Equicord settings.json missing.' }
          $settings = Get-Content $settingsFile -Raw | ConvertFrom-Json
          if (-not $settings.plugins.GoLiveBypass.enabled) { throw 'GoLiveBypass is not enabled.' }
          if ($settings.plugins.GoLiveBypass.proxy -ne 'socks5://127.0.0.1:9060') { throw 'GoLiveBypass is not pinned to local Tor.' }

          $tor = Join-Path $env:LOCALAPPDATA 'GoLiveBypass\Tor\tor\tor.exe'
          if (-not (Test-Path $tor)) { throw 'Managed Tor missing.' }
          $torVersion = (& $tor --version | Out-String)
          if ($torVersion -notmatch 'Tor version 0\.4\.9\.') { throw "Unexpected Tor version: $torVersion" }

          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $run = (Get-ItemProperty -Path $runKey -Name 'GoLiveBypassTor' -ErrorAction Stop).GoLiveBypassTor
          if ($run -notmatch '(?i)wscript\.exe' -or $run -notmatch '(?i)GoLiveBypassTor\.vbs') {
            throw "Tor startup is not hidden: $run"
          }

          Get-Process -Name Discord -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue


  mod-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Vencord
            repo: https://github.com/Vendicated/Vencord.git
          - name: Equicord
            repo: https://github.com/Equicord/Equicord.git

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: enhanced

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Clone ${{ matrix.name }}
        run: git clone --depth 1 "${{ matrix.repo }}" mod

      - name: Install matching pnpm
        working-directory: mod
        run: |
          PM="$(node -p "require('./package.json').packageManager")"
          npm install -g "$PM"
          pnpm --version

      - name: Copy enhanced userplugin
        run: |
          mkdir -p mod/src/userplugins
          rm -rf mod/src/userplugins/goLiveBypass
          cp -R enhanced/goLiveBypass mod/src/userplugins/goLiveBypass

      - name: Install dependencies
        working-directory: mod
        run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.name }} with enhanced plugin
        working-directory: mod
        run: pnpm build
