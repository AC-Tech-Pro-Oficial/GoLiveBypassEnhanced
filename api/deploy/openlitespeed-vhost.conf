# Integração da API de bug reports no vhost api.skyplaceia.com (OpenLiteSpeed/CyberPanel)
#
# IMPORTANTE: este vhost JA TEM outros servicos:
#   context /   -> supabaseapi  (127.0.0.1:8000)
#   context /v2 -> pagamentos   (127.0.0.1:8001)
# NADA disso pode ser alterado. A API de bugs entra com um context proprio em /bugs.
#
# O rewrite [P] NAO funciona aqui ("Can not determine proxy host name" no OLS),
# por isso usamos o mesmo mecanismo dos demais servicos: context type=proxy.

extProcessor golivebugapi {
  type                    proxy
  address                 127.0.0.1:8091
  maxConns                100
  pcKeepAliveTimeout      60
  initTimeout             60
  retryTimeout            0
  respBuffer              0
}

context /bugs {
  type                    proxy
  handler                 golivebugapi
  addDefaultCharset       off
}
