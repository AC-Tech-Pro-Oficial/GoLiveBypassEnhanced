name: golivebugapi

services:
  bugreport-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: golive-api:latest
    container_name: golivebugapi
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8091:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
